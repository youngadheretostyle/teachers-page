<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Приклад персональної сторінки викладача">
  <title>Персональна сторінка викладача</title>
  <style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f7fa;color:#253347;font-family:Arial,sans-serif;line-height:1.5}
header{background:#18375c;color:white}.top{padding:16px 3%;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.brand{font-size:21px;font-weight:700}nav{display:flex;gap:27px;flex-wrap:wrap}nav a{font-size:17px;color:white;text-decoration:none}nav a:hover{text-decoration:underline}
main{max-width:1600px;margin:auto;padding:42px 5%}.profile{background:white;border:1px solid #d9e2ec;border-radius:12px;min-height:237px;padding:33px 45px;display:flex;gap:32px;margin:0 2% 58px;box-shadow:0 3px 15px #1b34550b}.portrait{width:202px;height:170px;flex:none;background:#eef4fa;border:2px dashed #a9bed1;border-radius:10px;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden}.portrait:before{content:'';font-size:15px;color:#58718b;padding:15px}.profile h1{font-size:32px;color:#18375c;margin:-9px 0 4px}.position{font-size:20px;color:#2865a0;font-weight:600;margin:0 0 12px}.profile p{margin:3px 0;font-size:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5.5%;margin-bottom:58px}.grid2{display:grid;grid-template-columns:1fr 1.28fr;gap:10%;margin:0 1% 35px}section.panel{background:white;border:1px solid #d9e2ec;border-radius:12px;min-width:0;min-height:192px;overflow:hidden;box-shadow:0 3px 15px #1b34550b}section.panel h2{font-size:20px;color:#18375c;font-weight:700;margin:0;border-bottom:1px solid #d9e2ec;padding:14px 16px}section.panel>ul,section.panel>p,section.panel>.notice{margin:12px 16px}section.panel ul{padding-left:22px}section.panel li{margin:6px 0}.files{list-style:none;padding:0!important}.files li{border-bottom:1px solid #d9e2ec;padding:5px 0}.files span{display:block;color:#61738a;font-size:12px}.table-wrap{padding:8px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #d9e2ec;padding:7px 5px;text-align:left}th{background:#eef4fa;color:#18375c;font-weight:600}tbody tr:nth-child(odd){background:#f5f7fa}.notice{border-bottom:1px solid #d9e2ec;padding:5px 0}.date{font-size:12px;color:#61738a}a{color:#145c9a}@media(max-width:800px){main{padding:24px 16px}.profile{margin:0 0 24px;padding:20px;flex-direction:column}.grid3,.grid2{grid-template-columns:1fr;gap:20px;margin:0 0 20px}nav{gap:12px}nav a{font-size:15px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">Персональна сторінка викладача</div><nav aria-label="Головне меню"><a href="#home">Головна</a><a href="#subjects">Дисципліни</a><a href="#materials">Матеріали</a><a href="#schedule">Розклад</a><a href="#science">Наука</a><a href="#teacher-contacts">Контакти</a></nav></div></header>
<main id="home">
  <section id="teacher-contacts" class="profile" aria-labelledby="teacher-name"><div class="portrait" role="img" ></div><div><h1 id="teacher-name">Ім'я викладача</h1><p class="position">Посада</p><p><strong>Мобільний:</strong></p><p><strong>Кабінет:</strong></p><p><strong>Електронна пошта:</strong></p></div></section>
  <div class="grid3">
    <section class="panel" id="subjects"><h2>Дисципліни</h2></section>
    <section class="panel" id="materials"><h2>Навчальні матеріали</h2></section>
    <section class="panel" id="schedule"><h2>Розклад занять</h2><div class="table-wrap"><table><thead><tr><th>День</th><th>Час</th><th>Дисципліна</th><th>Аудиторія</th></tr></thead><tbody><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr><tr><td></td><td></td><td></td><td></td></tr></tbody></table></div></section>
  </div>
  <div class="grid2">
    <section class="panel" id="science"><h2>Наукова діяльність</h2></section>
    <section class="panel" id="announcements"><h2>Оголошення</h2></section>
  </div>
</main>
</body>
</html>
